# ============================================================
# AtopMall 全栈 Nginx 部署配置（用户前台 + 管理后台）
#
# 部署步骤：
#   1. 放到 /data/nginx/conf.d/nginx_atopmall.conf
#   2. 改一处：set $backend_host 后面的地址
#   3. 重载配置
#
# ============================================================

server {
    listen 80;
    server_name _;

    # ============================================================
    # 后端网关地址（全项目唯一需要修改的地方）
    # ============================================================
    set $backend_host 192.168.1.106:8000;

    # ============================================================
    # API 网关代理
    # ============================================================
    location /u/v1  { proxy_pass http://$backend_host; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /g/v1  { proxy_pass http://$backend_host; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /o/v1  { proxy_pass http://$backend_host; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /op/v1 { proxy_pass http://$backend_host; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /oss/v1{ proxy_pass http://$backend_host; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # ============================================================
    # 管理后台（独立子路径 /admin，独立 html 目录）
    # ============================================================
    location ^~ /admin {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ============================================================
    # 用户前台（根路径 /）
    # ============================================================
    root /usr/share/nginx/html/user/;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # 静态资源缓存
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}